name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild every model, ignoring the incremental build stamps"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types and unit tests. Independent of the model build so it reports in
  # well under a minute instead of behind several minutes of OCC work. It does
  # not gate the deploy: a lint error is not a broken site, and the build job is
  # already the gate that matters. Add it to `deploy.needs` to make it one.
  check:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    # `uv run` re-syncs the project before running, using the *default* groups --
    # which would pull `viewer` (and so pygobject, and so GTK) straight back in
    # and undo the `--no-group viewer` on the sync step below. Pinning the
    # environment to exactly what that step installed is the point; it also means
    # a missing sync step fails loudly instead of silently installing.
    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Only what pycairo needs to compile. `render_a4_pdf.py` imports it, so
      # without this the type check cannot resolve `cairo` and its test cannot
      # import at all. Deliberately not the GTK/girepository set the build used
      # to install: `pygobject` is left out below, since opening a viewer window
      # is not something CI does.
      - name: Install cairo headers (for pycairo, which has no Linux wheel)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config python3-dev

      - name: Install Python dependencies
        run: uv sync --frozen --no-group viewer

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check .

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -t .

  build:
    name: Build & Export Models
    runs-on: ubuntu-latest
    # See the note on the `check` job: without this, `uv run` reinstalls the
    # viewer group and the build needs GTK again.
    env:
      UV_NO_SYNC: "1"

    steps:
      # Full history, not the default single commit: the web bundle dates every
      # model from `git log` (website._last_edited), and a shallow checkout has
      # exactly one commit that adds every file -- so all 41 models would show
      # the same date, and the field would silently be a lie rather than an error.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # No apt step, and that is the point: nothing the model build imports needs
      # a system library. `pygobject` and `pycairo` are the only two packages
      # that would, they are the only two behind these flags, and neither is on
      # the path from `create()` to an STL.
      - name: Install Python dependencies
        run: uv sync --frozen --no-group viewer --no-group pdf

      # `exports/` carries `.build-stamps.json`, so restoring it is what lets
      # main.py skip the models no change can reach. The key is unique per commit
      # and the prefix restore-key picks up the most recent previous run; bump
      # the `v1` to discard every stamp and rebuild the roster once.
      - name: Restore built models
        uses: actions/cache/restore@v6
        with:
          path: exports
          key: exports-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            exports-v1-${{ runner.os }}-

      - name: Record the restored build state
        id: before
        run: echo "hash=$(sha256sum exports/.build-stamps.json 2>/dev/null | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build stale models (STL + STEP + GLB)
        env:
          # `inputs` is empty for push and pull_request, so this is '' there.
          FORCE: ${{ inputs.force_rebuild && '--all' || '' }}
        run: uv run python main.py $FORCE

      - name: Record the resulting build state
        id: after
        run: echo "hash=$(sha256sum exports/.build-stamps.json 2>/dev/null | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Only when something actually got built. Saving unconditionally would
      # re-upload an identical `exports/` under a fresh key on every push, which
      # churns the repository's 10 GB cache budget for no benefit.
      - name: Save built models
        if: steps.before.outputs.hash != steps.after.outputs.hash
        uses: actions/cache/save@v6
        with:
          path: exports
          key: exports-v1-${{ runner.os }}-${{ github.sha }}

      - name: Build web bundle (manifest + py-sources + copy render assets)
        run: uv run python -c "import website; website.build_web_bundle()"

      - name: Upload website
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/
          retention-days: 7

  # Both publishing jobs push the `gh-pages` branch instead of uploading a Pages
  # artifact, and that is what makes per-PR previews possible at all: Pages
  # serves exactly one source, so previews have to live in subdirectories of the
  # same site as production. `actions/deploy-pages` replaces the whole site on
  # every deploy and cannot do that. (It is not missed. Its queue wait was the
  # entire cost of the old deploy job -- anywhere from 11s to the ten-minute
  # ceiling the action clamps its own `timeout` input to, which is why that job
  # had to call it twice to be reliable.)
  #
  # The branch is a snapshot, not a history: see `.github/scripts/publish-pages.sh`.
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    permissions:
      contents: write

    # Shared with the `preview` job below and with pr-preview-cleanup.yml. The
    # branch is force-pushed as a single commit, so two of these running at once
    # is one of them being silently thrown away. `cancel-in-progress: false`
    # because a deploy that is already running is the one carrying the newest
    # site.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      # Only the publish script -- the job needs no source, and a sparse
      # checkout of one directory keeps it that way.
      - name: Checkout the publish script
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Download website
        uses: actions/download-artifact@v8
        with:
          name: website
          path: _site

      - name: Publish to the site root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-pages.sh publish . _site

  preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    needs: build
    # Same-repository pull requests only. A fork's `pull_request` run gets a
    # read-only token by design, so it *cannot* push the branch -- and the fix
    # for that is `pull_request_target`, which would run this workflow's own
    # code against the fork's tree with a writable token. Not worth a preview.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write
      pull-requests: write

    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout the publish script
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Download website
        uses: actions/download-artifact@v8
        with:
          name: website
          path: _site

      - name: Publish the preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-pages.sh publish "pr-${{ github.event.number }}" _site

      # One comment per PR, edited in place on every push. A fresh comment each
      # time would bury the review under a wall of identical links.
      - name: Comment the preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY#*/}
          url="https://${owner,,}.github.io/${repo}/pr-${PR}/"
          body=$(printf '%s\n' \
            '<!-- pages-preview -->' \
            '### Preview site' \
            '' \
            "$url" \
            '' \
            "Built from ${HEAD_SHA:0:7}. Rebuilt on every push to this PR and" \
            'deleted when the PR closes. Pages can take a minute to serve a' \
            'fresh deploy.')
          marker='<!-- pages-preview -->'
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body"
          fi
