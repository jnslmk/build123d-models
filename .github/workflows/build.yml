name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild every model, ignoring the incremental build stamps"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types and unit tests. Independent of the model build so it reports in
  # well under a minute instead of behind several minutes of OCC work. It does
  # not gate the deploy: a lint error is not a broken site, and the build job is
  # already the gate that matters. Add it to `deploy.needs` to make it one.
  check:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    # `uv run` re-syncs the project before running, using the *default* groups --
    # which would pull `viewer` (and so pygobject, and so GTK) straight back in
    # and undo the `--no-group viewer` on the sync step below. Pinning the
    # environment to exactly what that step installed is the point; it also means
    # a missing sync step fails loudly instead of silently installing.
    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Only what pycairo needs to compile. `render_a4_pdf.py` imports it, so
      # without this the type check cannot resolve `cairo` and its test cannot
      # import at all. Deliberately not the GTK/girepository set the build used
      # to install: `pygobject` is left out below, since opening a viewer window
      # is not something CI does.
      - name: Install cairo headers (for pycairo, which has no Linux wheel)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config python3-dev

      - name: Install Python dependencies
        run: uv sync --frozen --no-group viewer

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check .

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -t .

  build:
    name: Build & Export Models
    runs-on: ubuntu-latest
    # See the note on the `check` job: without this, `uv run` reinstalls the
    # viewer group and the build needs GTK again.
    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # No apt step, and that is the point: nothing the model build imports needs
      # a system library. `pygobject` and `pycairo` are the only two packages
      # that would, they are the only two behind these flags, and neither is on
      # the path from `create()` to an STL.
      - name: Install Python dependencies
        run: uv sync --frozen --no-group viewer --no-group pdf

      # `exports/` carries `.build-stamps.json`, so restoring it is what lets
      # main.py skip the models no change can reach. The key is unique per commit
      # and the prefix restore-key picks up the most recent previous run; bump
      # the `v1` to discard every stamp and rebuild the roster once.
      - name: Restore built models
        uses: actions/cache/restore@v6
        with:
          path: exports
          key: exports-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            exports-v1-${{ runner.os }}-

      - name: Record the restored build state
        id: before
        run: echo "hash=$(sha256sum exports/.build-stamps.json 2>/dev/null | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build stale models (STL + STEP + GLB)
        env:
          # `inputs` is empty for push and pull_request, so this is '' there.
          FORCE: ${{ inputs.force_rebuild && '--all' || '' }}
        run: uv run python main.py $FORCE

      - name: Record the resulting build state
        id: after
        run: echo "hash=$(sha256sum exports/.build-stamps.json 2>/dev/null | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Only when something actually got built. Saving unconditionally would
      # re-upload an identical `exports/` under a fresh key on every push, which
      # churns the repository's 10 GB cache budget for no benefit.
      - name: Save built models
        if: steps.before.outputs.hash != steps.after.outputs.hash
        uses: actions/cache/save@v6
        with:
          path: exports
          key: exports-v1-${{ runner.os }}-${{ github.sha }}

      - name: Build web bundle (manifest + py-sources + copy render assets)
        run: uv run python -c "import website; website.build_web_bundle()"

      - name: Upload website
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download website
        uses: actions/download-artifact@v8
        with:
          name: website
          path: _site

      - name: Upload to GitHub Pages
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # `deploy-pages` polls until GitHub's Pages backend picks the deployment
      # up, and that queue is the whole cost of this job: the tar and upload
      # above take seconds, the file sync at the far end takes seconds, and
      # everything between is `deployment_queued`. That wait has been anywhere
      # from 11s to 9m31s on consecutive pushes, and the action's default
      # timeout is 10 minutes -- close enough that a slightly slower queue turns
      # a perfectly good build into a red one. Nothing here can shorten the
      # wait, so just refuse to give up on it.
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
