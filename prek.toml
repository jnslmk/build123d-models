# See https://github.com/zaffranle/prek
# See https://pre-commit.com/hooks.html for more hooks

repos = [
  {
    repo = "local",
    hooks = [
      {
        id = "ruff-format",
        name = "ruff format",
        entry = "ruff format",
        language = "system",
        types = ["python"],
        pass_filenames = true
      },
      {
        id = "ruff-lint",
        name = "ruff lint",
        entry = "ruff check",
        language = "system",
        types = ["python"],
        pass_filenames = true
      },
      {
        id = "markdownlint",
        name = "markdownlint",
        entry = "npx --yes markdownlint-cli",
        language = "system",
        types = ["markdown"],
        pass_filenames = true
      }
    ]
  }
]