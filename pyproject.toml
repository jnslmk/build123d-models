[project]
name = "build123d-models"
version = "0.1.0"
description = "Collection of 3D printable models built with build123d"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.10.0",
    "ocp-vscode>=3.4.0",
    "ocp-tessellate>=3.3.0",
    "pygobject>=3.54.5",
    "pywebview>=6.1",
]

[project.scripts]
show = "show:main"
export = "export_model:main"
check = "check:main"
render = "render_svg:main"
render-a4 = "render_a4_pdf:main"
selection = "selection:main"
website = "website:main"

[tool.uv]
package = true

[tool.setuptools]
# Subpackages are not implied by their parent -- list every one, or a built
# wheel silently ships without it.
packages = ["models", "models.lib", "models.led_psu_enclosure"]
py-modules = ["fontfix", "show", "export_model", "check", "main", "viewer", "render_svg", "render_a4_pdf", "export", "selection", "tessellate_models", "website"]

[dependency-groups]
dev = [
    "ruff>=0.14.7",
    "ty>=0.0.1a29",
    "watchfiles>=0.24.0",
]
