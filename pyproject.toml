[project]
name = "build123d-models"
version = "0.1.0"
description = "Collection of 3D printable models built with build123d"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Standard hardware (threads, fasteners, bearings) from build123d's official
    # companion library. Capped below 0.3.0 on purpose: 0.3.0 requires
    # build123d>=0.11.1, which drags the whole OCP stack from OCCT 7.8 to 7.9
    # (cadquery-ocp -> cadquery-ocp-novtk + -proxy, vtk/matplotlib dropped) and
    # would move every model's geometry. 0.2.x needs only build123d>=0.10.0 and
    # adds zero transitive packages. Lift the cap together with build123d.
    "bd-warehouse>=0.2.0,<0.3.0",
    "build123d>=0.10.0",
    "ocp-vscode>=3.4.0",
    "ocp-tessellate>=3.3.0",
    # Pure-Python wheel with no system dependencies, unlike the two below, so it
    # stays a plain dependency: that keeps ``viewer.py``'s import resolvable
    # everywhere and costs an install nothing.
    "pywebview>=6.1",
]

[project.scripts]
show = "show:main"
export = "export_model:main"
check = "check:main"
check-diff = "check_diff:main"
deps = "model_deps:main"
render = "render_svg:main"
render-a4 = "render_a4_pdf:main"
selection = "selection:main"
sketch = "sketch:main"
view = "view_artifact:main"
website = "website:main"

[tool.uv]
package = true
# Both extra groups are *default* groups, so a plain ``uv sync`` still gives a
# developer everything and no local command grows a flag. They are groups rather
# than plain dependencies because between them they are the only reason CI would
# ever need `apt`: neither pygobject nor pycairo ships a Linux wheel, so
# installing one means a source build against system headers. The model build
# imports neither, so it asks for neither and needs no system packages at all.
default-groups = ["dev", "viewer", "pdf"]

[tool.setuptools]
# Subpackages are not implied by their parent -- list every one, or a built
# wheel silently ships without it.
packages = [
    "models",
    "models.lib",
    "models.cable_spool",
    "models.drill_storage",
    "models.drill_storage.allen",
    "models.drill_storage.hex",
    "models.drill_storage.hex.bits",
    "models.drill_storage.metal",
    "models.drill_storage.stone",
    "models.drill_storage.wood",
    "models.led_profiles",
    "models.led_profiles.stand",
    "models.led_profiles.assemblies",
    "models.led_psu_enclosure",
    "models.salad_bowl_lamp",
    "models.sonicare_charger_holder",
    "models.spiral_vase_lampshade",
]
py-modules = ["fontfix", "show", "export_model", "check", "check_diff", "main", "model_deps", "viewer", "render_svg", "render_a4_pdf", "export", "selection", "sketch", "tessellate_models", "view_artifact", "website"]

[dependency-groups]
dev = [
    "ruff>=0.14.7",
    "ty>=0.0.1a29",
    "watchfiles>=0.24.0",
]
# The GTK backend pywebview drives in ``viewer.py``. Needed to *open* the viewer
# window, not to import it -- and it builds from source against libgirepository
# and GTK, so the model build stays clear of it.
viewer = [
    "pygobject>=3.54.5",
]
# ``render_a4_pdf.py`` draws its sheets with pycairo, which publishes Windows
# wheels only and so builds against libcairo2-dev everywhere else.
pdf = [
    "pycairo>=1.29.0",
]
mesh = [
    "manifold3d>=3.5.2",
    "rtree>=1.4.1",
    "shapely>=2.1.2",
    "trimesh>=5.0.0",
]
# The image maths behind the ``photo-reverse-engineering`` skill: homography
# rectification and silhouette rasterising. Both packages are already in the
# tree as transitive dependencies of the OCP stack, so this group costs an
# install nothing -- it is declared so the scripts import something this
# project asked for rather than something it happened to inherit. Not a default
# group, and no model imports it, so the CI build never resolves it.
photo = [
    "numpy>=2.0",
    "pillow>=11.0",
]
