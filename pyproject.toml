[project]
name = "build123d-models"
version = "0.1.0"
description = "Collection of 3D printable models built with build123d"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Standard hardware (threads, fasteners, bearings) from build123d's official
    # companion library. Capped below 0.3.0 on purpose: 0.3.0 requires
    # build123d>=0.11.1, which drags the whole OCP stack from OCCT 7.8 to 7.9
    # (cadquery-ocp -> cadquery-ocp-novtk + -proxy, vtk/matplotlib dropped) and
    # would move every model's geometry. 0.2.x needs only build123d>=0.10.0 and
    # adds zero transitive packages. Lift the cap together with build123d.
    "bd-warehouse>=0.2.0,<0.3.0",
    "build123d>=0.10.0",
    "ocp-vscode>=3.4.0",
    "ocp-tessellate>=3.3.0",
]

[project.scripts]
show = "show:main"
export = "export_model:main"
check = "check:main"
check-diff = "check_diff:main"
deps = "model_deps:main"
render = "render_svg:main"
render-a4 = "render_a4_pdf:main"
selection = "selection:main"
website = "website:main"

[tool.uv]
package = true
# ``viewer`` is a default group, so ``uv sync`` still gives a developer a working
# ``uv run show`` with no extra flag. It is a *group* rather than a plain
# dependency so that CI can leave it out with ``--no-group viewer``: nothing in
# the build path imports pywebview or gi, and installing pygobject means
# building it from source against libgirepository, libcairo and GTK, which is an
# apt step and a compile that the model build has no use for.
default-groups = ["dev", "viewer"]

[tool.setuptools]
# Subpackages are not implied by their parent -- list every one, or a built
# wheel silently ships without it.
packages = [
    "models",
    "models.lib",
    "models.drill_fit_tester",
    "models.drill_storage",
    "models.drill_storage.assemblies",
    "models.drill_storage.flex",
    "models.led_profiles",
    "models.led_profiles.assemblies",
    "models.led_psu_enclosure",
]
py-modules = ["fontfix", "show", "export_model", "check", "check_diff", "main", "model_deps", "viewer", "render_svg", "render_a4_pdf", "export", "selection", "tessellate_models", "website"]

[dependency-groups]
dev = [
    "ruff>=0.14.7",
    "ty>=0.0.1a29",
    "watchfiles>=0.24.0",
]
# Only ``viewer.py`` needs these -- the pywebview window and the GTK backend it
# runs on. Kept out of the build path so CI never has to install GTK to export
# an STL; see the note on ``default-groups`` above.
viewer = [
    "pygobject>=3.54.5",
    "pywebview>=6.1",
]
mesh = [
    "manifold3d>=3.5.2",
    "rtree>=1.4.1",
    "shapely>=2.1.2",
    "trimesh>=5.0.0",
]
