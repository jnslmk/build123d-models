<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>build123d models — parametric, in your browser</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #14171c; color: #e6e8eb;
    display: grid;
    grid-template: "bar bar bar" auto
                   "side edit view" 1fr
                 / 300px minmax(320px, 1fr) minmax(360px, 1.25fr);
    height: 100vh;
  }
  #bar {
    grid-area: bar; display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; border-bottom: 1px solid #2a2f37; background: #171b21;
  }
  #bar h1 { font-size: 15px; margin: 0; white-space: nowrap; font-weight: 600; }
  #bar .spacer { flex: 1; }
  #runtime { font-size: 11px; color: #8b93a1; border: 1px solid #2a2f37; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  #runtime.ready { color: #7fd18a; border-color: #2f5c37; }
  #runtime.err { color: #e88; border-color: #5c2f2f; }
  button {
    padding: 6px 12px; border: 1px solid #333a44; border-radius: 6px; font-weight: 600;
    cursor: pointer; background: #232a33; color: #cdd3db; font-size: 13px;
  }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:not(:disabled):hover { border-color: #4a90ff; }

  #side { grid-area: side; overflow-y: auto; padding: 14px; border-right: 1px solid #2a2f37; }
  #edit { grid-area: edit; display: flex; flex-direction: column; border-right: 1px solid #2a2f37; min-width: 0; }
  #view { grid-area: view; position: relative; min-width: 0; min-height: 0; }

  label.fld { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #9aa4b2; margin: 0 0 5px; }
  select {
    width: 100%; background: #0f1216; color: #e6e8eb; border: 1px solid #333a44;
    border-radius: 6px; padding: 6px 8px; font-size: 14px;
  }
  h2.sec { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #9aa4b2; margin: 20px 0 8px; }
  #params.disabled { opacity: .4; pointer-events: none; }
  .prow { margin: 0 0 12px; }
  .prow .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .prow .top label { font-size: 13px; color: #cdd3db; }
  .prow input[type=number] {
    width: 74px; background: #0f1216; color: #e6e8eb; border: 1px solid #333a44;
    border-radius: 4px; padding: 3px 6px; font-size: 13px; text-align: right;
  }
  .prow input[type=range] { width: 100%; margin: 6px 0 0; accent-color: #3b82f6; }
  .muted { color: #8b93a1; font-size: 12px; }
  #noparams { font-size: 12px; color: #8b93a1; font-style: italic; }

  #log {
    margin-top: 16px; font: 11px/1.4 ui-monospace, "SF Mono", monospace; color: #8b93a1;
    white-space: pre-wrap; max-height: 220px; overflow-y: auto; word-break: break-word;
    background: #0f1216; border: 1px solid #262b33; border-radius: 6px; padding: 8px;
  }

  #edit .ehead { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #2a2f37; background: #171b21; }
  #edit .ehead .t { font-size: 12px; color: #9aa4b2; flex: 1; font-family: ui-monospace, monospace; }
  #edit .cm { flex: 1; overflow: hidden; min-height: 0; }
  .cm-editor { height: 100%; }
  .cm-scroller { font: 13px/1.5 ui-monospace, "SF Mono", monospace; }

  /* Absolutely positioned so the canvas's intrinsic aspect ratio (derived from its
     drawing-buffer width/height attributes) can't feed back into the grid track's
     min-content height. Otherwise growing the window after a resize blows the
     "view" row out to width×(oldH/oldW) and the page overflows vertically. */
  canvas#viewer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #vinfo { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #6b7280; pointer-events: none; }
  #vstatus { position: absolute; left: 12px; top: 10px; right: 12px; font-size: 12px; color: #cdd3db;
    background: rgba(20,23,28,.7); border: 1px solid #2a2f37; border-radius: 6px; padding: 5px 10px; }
  #vstatus.err { color: #f0a5a5; border-color: #5c2f2f; }
  #vstatus.hidden { display: none; }
</style>

<div id="bar">
  <h1>build123d ⋅ models</h1>
  <span id="runtime">Python: booting…</span>
  <div class="spacer"></div>
  <button id="btn-run" disabled title="Run the edited code">Run code ▶</button>
  <button id="btn-revert" disabled title="Restore the original source">Revert</button>
  <button id="btn-stl" class="primary" disabled>Download STL</button>
  <button id="btn-step" disabled>Download STEP</button>
</div>

<aside id="side">
  <label class="fld" for="model">Model</label>
  <select id="model"></select>

  <h2 class="sec">Parameters</h2>
  <div id="params"></div>
  <div id="noparams" hidden>No parameters — edit the code to change this model.</div>

  <h2 class="sec">Log</h2>
  <div id="log"></div>
</aside>

<section id="edit">
  <div class="ehead">
    <span class="t" id="edit-file">models/…</span>
    <span class="muted" id="edit-dirty"></span>
  </div>
  <div class="cm" id="cm"></div>
</section>

<section id="view">
  <div id="vstatus" class="hidden"></div>
  <canvas id="viewer"></canvas>
  <div id="vinfo">drag = rotate · scroll = zoom · right-drag = pan</div>
</section>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { EditorView, basicSetup } from 'https://esm.sh/codemirror@6.0.1';
import { python } from 'https://esm.sh/@codemirror/lang-python@6.1.6';
import { oneDark } from 'https://esm.sh/@codemirror/theme-one-dark@6.1.2';

// ---------------------------------------------------------------------------
// Three.js viewer (Z-up, grid on XY — build123d's convention)
// ---------------------------------------------------------------------------
const canvas = document.getElementById('viewer');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1e24);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 20000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.12;
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(120, 80, 200); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-90, -130, 90); scene.add(fill);
const grid = new THREE.GridHelper(400, 20, 0x3a4048, 0x2a2f37); grid.rotation.x = Math.PI / 2; scene.add(grid);
const material = new THREE.MeshStandardMaterial({ color: 0x59a6ff, metalness: 0.1, roughness: 0.55, flatShading: true });
let currentMesh = null;

function frameMesh(mesh) {
  const box = new THREE.Box3().setFromObject(mesh);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  const dist = Math.max(size.x, size.y, size.z) * 1.7 + 30;
  camera.position.set(center.x + dist * 0.7, center.y - dist, center.z + dist * 0.6);
  camera.near = Math.max(0.1, dist / 500); camera.far = dist * 20; camera.updateProjectionMatrix();
  controls.update();
}
function showStl(bytes, reframe) {
  const buf = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
  const geom = new STLLoader().parse(buf);
  geom.computeVertexNormals();
  if (currentMesh) { scene.remove(currentMesh); currentMesh.geometry.dispose(); }
  currentMesh = new THREE.Mesh(geom, material);
  scene.add(currentMesh);
  if (reframe) frameMesh(currentMesh);
}
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(document.getElementById('view'));
resize();
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

function triCount(bytes) {  // binary STL: uint32 triangle count at byte 80
  return bytes.byteLength >= 84 ? new DataView(bytes.buffer, bytes.byteOffset).getUint32(80, true) : 0;
}

// ---------------------------------------------------------------------------
// UI element handles
// ---------------------------------------------------------------------------
const el = {
  model: document.getElementById('model'),
  params: document.getElementById('params'),
  noparams: document.getElementById('noparams'),
  log: document.getElementById('log'),
  runtime: document.getElementById('runtime'),
  vstatus: document.getElementById('vstatus'),
  editFile: document.getElementById('edit-file'),
  editDirty: document.getElementById('edit-dirty'),
  btnRun: document.getElementById('btn-run'),
  btnRevert: document.getElementById('btn-revert'),
  btnStl: document.getElementById('btn-stl'),
  btnStep: document.getElementById('btn-step'),
};
function log(m) { el.log.textContent += m + '\n'; el.log.scrollTop = el.log.scrollHeight; }
function setRuntime(text, cls) { el.runtime.textContent = text; el.runtime.className = cls || ''; }
function setVStatus(text, isErr) {
  if (!text) { el.vstatus.classList.add('hidden'); return; }
  el.vstatus.textContent = text; el.vstatus.classList.remove('hidden');
  el.vstatus.classList.toggle('err', !!isErr);
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let manifest = null;         // { models: [...] }
let sources = {};            // { "models/cube.py": "<text>" }
let current = null;          // current model manifest entry
let workerReady = false;
let firstFrameForModel = true;
let editorDirty = false;
let lastStl = null;          // Uint8Array from the worker (live geometry)
let lastStep = null;         // ArrayBuffer from the worker, or null

// ---------------------------------------------------------------------------
// CodeMirror editor
// ---------------------------------------------------------------------------
const dirtyWatcher = EditorView.updateListener.of((u) => { if (u.docChanged) markDirty(); });
const editor = new EditorView({
  parent: document.getElementById('cm'),
  extensions: [basicSetup, python(), oneDark, dirtyWatcher, EditorView.lineWrapping],
});
function setEditor(text) {
  editor.dispatch({ changes: { from: 0, to: editor.state.doc.length, insert: text } });
}
function markDirty() {
  if (!current) return;
  const pristine = sources[current.source] || '';
  const nowDirty = editor.state.doc.toString() !== pristine;
  if (nowDirty === editorDirty) return;
  editorDirty = nowDirty;
  el.editDirty.textContent = nowDirty ? '● edited' : '';
  el.btnRevert.disabled = !nowDirty;
  el.params.classList.toggle('disabled', nowDirty);
}

// ---------------------------------------------------------------------------
// Parameter form
// ---------------------------------------------------------------------------
function buildForm(params) {
  el.params.innerHTML = '';
  el.noparams.hidden = params.length > 0;
  for (const p of params) {
    const row = document.createElement('div'); row.className = 'prow';
    const top = document.createElement('div'); top.className = 'top';
    const lab = document.createElement('label'); lab.textContent = p.label || p.name;
    const num = document.createElement('input');
    num.type = 'number'; num.dataset.name = p.name;
    num.min = p.min; num.max = p.max; num.step = p.step; num.value = p.default;
    top.append(lab, num);
    const rng = document.createElement('input');
    rng.type = 'range'; rng.min = p.min; rng.max = p.max; rng.step = p.step; rng.value = p.default;
    num.addEventListener('input', () => { rng.value = num.value; scheduleRegen(); });
    rng.addEventListener('input', () => { num.value = rng.value; scheduleRegen(); });
    row.append(top, rng);
    el.params.append(row);
  }
}
function readParams() {
  const p = {};
  for (const num of el.params.querySelectorAll('input[type=number]')) {
    const v = parseFloat(num.value);
    if (!Number.isNaN(v)) p[num.dataset.name] = v;
  }
  return p;
}

// ---------------------------------------------------------------------------
// Worker (Pyodide + build123d) — one job in flight, newest job coalesced
// ---------------------------------------------------------------------------
const worker = new Worker('./js/pyodide-worker.js');
let reqId = 0, busy = false, pending = null;

worker.onmessage = (ev) => {
  const m = ev.data;
  if (m.type === 'status') { setRuntime('Python: ' + shortStatus(m.text)); log(m.text); }
  else if (m.type === 'log') { log(m.text); }
  else if (m.type === 'ready') {
    workerReady = true;
    setRuntime('Python: ready', 'ready');
    el.btnRun.disabled = false;
    log('runtime ready — change a parameter or edit the code to rebuild live');
    drainPending();
  }
  else if (m.type === 'result') {
    busy = false;
    if (!current || m.model !== current.name) { drainPending(); return; }  // stale model
    const stl = new Uint8Array(m.stl);
    lastStl = stl; lastStep = m.step || null;
    showStl(stl, firstFrameForModel);
    firstFrameForModel = false;
    el.btnStl.disabled = false;
    el.btnStep.disabled = false;
    setVStatus(`${m.cached ? 'cached' : 'built in ' + (m.wallMs / 1000).toFixed(1) + ' s'} · ${triCount(stl).toLocaleString()} triangles`);
    drainPending();
  }
  else if (m.type === 'error') {
    busy = false;
    setVStatus('live rebuild failed — showing prebuilt model (see log)', true);
    log('ERROR: ' + m.message);
    if (m.id === undefined) setRuntime('Python: boot failed', 'err');
    drainPending();
  }
};
function shortStatus(t) { return t.length > 34 ? t.slice(0, 33) + '…' : t; }

function drainPending() {
  if (pending && !busy) { const p = pending; pending = null; sendJob(p); }
}
function sendJob(job) {
  if (!workerReady) { pending = job; return; }
  if (busy) { pending = job; setVStatus('queued — waiting for current build…'); return; }
  busy = true;
  setVStatus(job.payload.source !== undefined
    ? 'running edited code… (build123d is slow, up to ~20 s)'
    : 'building… (build123d is slow, up to ~20 s)');
  worker.postMessage({ type: 'generate', id: ++reqId, model: job.model, ...job.payload });
}

let debounce = null;
function scheduleRegen() {
  if (editorDirty) return;  // edited-code path owns the preview until Revert
  clearTimeout(debounce);
  debounce = setTimeout(() => sendJob({ model: current.name, payload: { params: readParams() } }), 450);
}

// ---------------------------------------------------------------------------
// Model selection
// ---------------------------------------------------------------------------
function selectModel(name) {
  current = manifest.models.find((x) => x.name === name);
  if (!current) return;
  firstFrameForModel = true;
  editorDirty = false; el.editDirty.textContent = ''; el.btnRevert.disabled = true;
  el.params.classList.remove('disabled');
  el.editFile.textContent = current.source;
  setEditor(sources[current.source] || '# source unavailable');
  buildForm(current.params || []);
  lastStl = null; lastStep = null;
  el.btnStl.disabled = !current.stl;
  el.btnStep.disabled = !current.step;
  // Instant preview from the CI-rendered STL while Pyodide is (or gets) ready.
  if (current.stl) {
    setVStatus('loading prebuilt preview…');
    const forName = name;
    fetch(current.stl).then((r) => r.arrayBuffer()).then((buf) => {
      if (current.name !== forName) return;  // model switched while fetching
      const bytes = new Uint8Array(buf);
      showStl(bytes, firstFrameForModel);
      firstFrameForModel = false;
      setVStatus(`prebuilt · ${triCount(bytes).toLocaleString()} triangles`);
    }).catch((e) => { setVStatus('no prebuilt preview', true); log('preview: ' + e); });
  } else {
    setVStatus('no prebuilt preview — run the code to build', false);
  }
  const url = new URL(location); url.searchParams.set('model', name); history.replaceState(null, '', url);
}

// ---------------------------------------------------------------------------
// Buttons
// ---------------------------------------------------------------------------
el.model.addEventListener('change', () => selectModel(el.model.value));
el.btnRun.addEventListener('click', () => {
  sendJob({ model: current.name, payload: { source: editor.state.doc.toString() } });
});
el.btnRevert.addEventListener('click', () => {
  setEditor(sources[current.source] || '');
  markDirty();
  scheduleRegen();
});
function download(data, filename, mime) {
  const blob = new Blob([data], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
el.btnStl.addEventListener('click', async () => {
  const name = current.name + '.stl';
  if (lastStl) return download(lastStl, name, 'model/stl');
  const buf = await (await fetch(current.stl)).arrayBuffer();  // CI fallback
  download(buf, name, 'model/stl');
});
el.btnStep.addEventListener('click', async () => {
  const name = current.name + '.step';
  if (lastStep) return download(lastStep, name, 'application/step');
  if (current.step) { const buf = await (await fetch(current.step)).arrayBuffer(); download(buf, name, 'application/step'); }
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
(async function boot() {
  try {
    [manifest, sources] = await Promise.all([
      fetch('models-manifest.json').then((r) => r.json()),
      fetch('py-sources.json').then((r) => r.json()),
    ]);
  } catch (e) {
    setVStatus('failed to load model manifest: ' + e, true); return;
  }
  for (const mdl of manifest.models) {
    const o = document.createElement('option'); o.value = mdl.name; o.textContent = mdl.label;
    el.model.append(o);
  }
  const wanted = new URL(location).searchParams.get('model');
  const start = manifest.models.find((x) => x.name === wanted) ? wanted : manifest.models[0].name;
  el.model.value = start;
  selectModel(start);
})();
</script>
